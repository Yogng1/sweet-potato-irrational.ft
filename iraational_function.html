<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>무리함수 탐험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  /* 구성: 방안지 위에 굵은 테두리의 만화 컷 같은 카드를 배치한다 (색감만 라벤더/민트/코랄로 변경) */
  --paper: #f1ebff;
  --grid: #dcd0f6;
  --card: #fffdf7;
  --ink: #1f1b2e;
  --muted: #5d586f;
  --base: #ff8a3d;
  --cy: #14b8a6;
  --cx: #ff5d8f;
  --co: #4f7cff;
  --yellow: #ffd23f;
  --font-d: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-b: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px; color: var(--ink); font-family: var(--font-b); font-size: 17px; line-height: 1.6;
}
h1, h2, h3 { font-family: var(--font-d); font-weight: 400; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 18px 16px 48px; }
:focus-visible { outline: 3px dashed var(--co); outline-offset: 3px; }

.top { display: flex; align-items: center; gap: 14px; padding: 6px 0 14px; }
.logo { width: 68px; height: 68px; flex: none; }
.top h1 { font-size: clamp(1.7rem, 5vw, 2.5rem); line-height: 1.1; }
.top p { color: var(--muted); font-size: .95rem; margin-top: 4px; }
.top p .fx { font-size: 1em; }

/* 탭 */
.tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.tabs button {
  font-family: var(--font-d); font-size: 1.15rem; padding: 7px 20px; display: inline-flex; align-items: baseline; gap: .45em;
  background: var(--card); border: 3px solid var(--ink); border-radius: 14px 6px 14px 6px; box-shadow: 3px 3px 0 var(--ink); cursor: pointer;
}
.tabs button[aria-selected="true"] { background: var(--yellow); transform: rotate(-1.2deg); }

.card { background: var(--card); border: 3px solid var(--ink); border-radius: 18px 6px 20px 8px; box-shadow: 6px 6px 0 var(--ink); padding: 18px; }
.card h2 { font-size: 1.45rem; margin-bottom: 10px; }
.muted { color: var(--muted); }

.btn {
  font-family: var(--font-d); font-size: 1.1rem; background: var(--yellow);
  border: 3px solid var(--ink); border-radius: 14px 6px 14px 6px; padding: 7px 20px;
  box-shadow: 3px 3px 0 var(--ink); cursor: pointer; transition: transform .08s, box-shadow .08s;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn.sub { background: var(--card); }
.btn.sm { font-size: .95rem; padding: 4px 12px; }

.ex { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.plot { padding: 10px; }
.plot canvas { display: block; width: 100%; aspect-ratio: 4 / 3; border-radius: 6px; }
.plotnote { margin: 8px 4px 0; font-size: .95rem; color: var(--muted); line-height: 1.75; }
.plotnote .math { font-size: 1.02em; }

/* 수식 */
.math { font-size: 1.12em; white-space: nowrap; }
.math.big { font-size: 1.7rem; }
.fx { display: inline-flex; align-items: baseline; gap: .3em; white-space: nowrap; }
.fx.tight { gap: .05em; }
.sq { display: inline-block; position: relative; padding-left: .8em; line-height: 0; }
.sq svg.rd { position: absolute; left: 0; top: 0; width: .8em; height: 100%; overflow: visible; }
.sq svg.rd path { fill: none; stroke: currentColor; stroke-width: 2px; stroke-linejoin: miter; stroke-linecap: butt; vector-effect: non-scaling-stroke; }
.sq .ov { display: inline-block; border-top: 2px solid currentColor; padding: .1em .22em 0 .05em; line-height: 1.25; }

.base { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 12px; background: #fff3e6; border: 2px dashed var(--ink); border-radius: 10px; margin-bottom: 12px; }
.base .tag { font-family: var(--font-d); background: var(--base); color: #fff; border: 2px solid var(--ink); border-radius: 8px; padding: 0 9px; font-size: .92rem; }

/* 1번 카드: 대칭 버튼 */
.symbtns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 6px 0 14px; }
.sbtn {
  font-family: var(--font-d); font-size: 1.1rem; background: #fff; border: 3px solid var(--ink); border-radius: 14px 6px 14px 6px;
  box-shadow: 3px 3px 0 var(--ink); padding: 10px 6px; cursor: pointer; display: grid; gap: 2px; justify-items: center; line-height: 1.2;
  transition: transform .08s, box-shadow .08s, background .15s;
}
.sbtn small { font-family: var(--font-b); font-size: .8rem; color: var(--muted); line-height: 1.3; text-align: center; }
.sbtn .dot { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--ink); background: var(--c); }
.sbtn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.sbtn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.sbtn[aria-pressed="true"] { background: var(--c); color: #fff; transform: rotate(-1.2deg); }
.sbtn[aria-pressed="true"] small { color: #fff; }
.sbtn[aria-pressed="true"] .dot { background: #fff; }

.empty { text-align: center; padding: 20px 10px; color: var(--muted); border: 2px dashed #b9b4c9; border-radius: 12px; }
.reset { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }

/* 2번 카드: 슬라이더 */
.slide { display: grid; gap: 2px; margin: 8px 0 12px; }
.slide span.lb { font-family: var(--font-d); font-size: 1.1rem; }
.slide output { display: inline-block; min-width: 2.2em; padding: 0 .4em; background: var(--yellow); border: 2px solid var(--ink); border-radius: 8px; text-align: center; font-family: var(--font-b); }
.slide.c2 output { background: #ffc2d4; }
input[type="range"] { width: 100%; accent-color: var(--co); height: 28px; }
.slide.c2 input[type="range"] { accent-color: var(--cx); }
.check { display: flex; gap: 8px; align-items: center; margin: 4px 0 8px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.chip { font-family: var(--font-d); font-size: 1rem; padding: 2px 14px; background: #fff; border: 3px solid var(--ink); border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--co); color: #fff; }
.chips.c2 .chip[aria-pressed="true"] { background: var(--cx); }
.tip { margin-top: 10px; padding: 7px 10px; background: #fff4c4; border-left: 5px solid var(--ink); font-size: .94rem; }


/* 3번 카드: 평행이동 */
.slide.c3 output { background: #d4c8ff; }
.slide.c3 input[type="range"] { accent-color: #6a5acd; }
.slide.c4 output { background: #bff0e8; }
.slide.c4 input[type="range"] { accent-color: var(--cy); }
.cur { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 12px; background: #eaf3ff; border: 2px solid var(--ink); border-radius: 10px; margin: 4px 0 12px; }
.cur .tag { font-family: var(--font-d); background: var(--co); color: #fff; border: 2px solid var(--ink); border-radius: 8px; padding: 0 9px; font-size: .92rem; }

/* 4번 카드: 무리구마 대결 */
.gcard { padding: 14px; }
.gcv { position: relative; }
.gcv canvas { display: block; width: 100%; aspect-ratio: 5 / 3; border: 3px solid var(--ink); border-radius: 12px; background: #dff2ff; }
.gtools { position: absolute; top: 8px; right: 8px; z-index: 6; display: flex; gap: 6px; }
.gfs { position: static; font: inherit; font-size: .9rem; border: 2.5px solid var(--ink); border-radius: 10px; background: #fff; padding: 3px 10px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
.gfs:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
/* 전체화면: 캔버스를 화면에 꽉 채우고 조절창은 땅 속에 겹쳐 놓는다 */
.gstage.full { background: #bfe3ff; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; height: 100dvh; }
.gstage.pfs { position: fixed; inset: 0; z-index: 9999; }
.gbox { container-type: inline-size; }
.gstage.full .gbox { position: relative; width: min(100vw, calc(100vh * 5 / 3)); width: min(100vw, calc(100dvh * 5 / 3)); }
.gstage.full .gcv canvas { border: 0; border-radius: 0; }
.gstage.full .gm-hud { position: absolute; top: 8px; left: 8px; right: 190px; z-index: 5; margin: 0; flex-wrap: nowrap; gap: 8px; pointer-events: none; }
.gstage.full .gpl { flex: 0 1 190px; min-width: 0; padding: 3px 8px; box-shadow: 2px 2px 0 var(--ink); opacity: .96; }
.gstage.full .gpl.out { opacity: .6; }
.gstage.full .gm-msg { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); z-index: 5; max-width: 86%; margin: 0; padding: 3px 14px; background: rgba(255,255,255,.32); border: 2.5px solid rgba(31,27,46,.38); border-radius: 12px; font-size: .95rem; text-align: center; pointer-events: none; text-shadow: 0 0 4px #fff, 0 0 4px #fff, 0 0 2px #fff; }
.gstage.full .gm-msg:empty { display: none; }
.gstage.full .gm-panel { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 16px; padding: 6px 12px; background: rgba(255,247,226,.93); border-radius: 14px; }
.gstage.full .gm-panel .gp-top, .gstage.full .gm-panel .gp-row { margin: 0; }
.gstage.full .gp-frow { flex: 1 1 auto; }
.gstage.full .gm-panel .btn { padding: 6px 16px; font-size: 1.05rem; }
.gstage.full .gp-f { font-size: clamp(.8rem, 1.8cqw, 1.15rem); }
@container (max-width: 760px) {
  .gstage.full .gm-hud { gap: 5px; top: 5px; left: 5px; right: 150px; }
  .gstage.full .gpl { flex: 0 1 150px; padding: 1px 6px; flex-direction: row; align-items: center; box-shadow: 2px 2px 0 var(--ink); border-width: 2px; }
  .gstage.full .gpl b { font-size: .78rem; padding: 0 5px; border-width: 1.5px; }
  .gstage.full .gpl .hr i { font-size: .66rem; letter-spacing: 0; }
  .gstage.full .gm-msg { top: 38px; font-size: .78rem; padding: 1px 10px; border-width: 2px; }
  .gstage.full .gtools { top: 5px; right: 5px; gap: 4px; }
  .gstage.full .gfs { font-size: .72rem; padding: 1px 7px; border-width: 2px; }
  .gstage.full .gm-panel { left: 5px; right: 5px; bottom: 5px; padding: 3px 8px; gap: 2px 10px; border-width: 2px; }
  .gstage.full .gp-top { font-size: .78rem; }
  .gstage.full .gp-who { padding: 0 6px; border-width: 1.5px; }
  .gstage.full .gitem { display: inline-block; background: #fff3b0; border: 2px solid var(--ink); border-radius: 9px; padding: 0 8px; margin-left: 4px; font-size: .95em; }
.gm-panel .gdraw:disabled { opacity: .45 !important; cursor: default; filter: grayscale(.5); }
.gp-lb { font-size: .7rem; padding: 0 5px; border-width: 1.5px; }
  .gstage.full .gt { font-size: .74rem; padding: 0 6px; border-width: 2px; }
  .gstage.full .gt.on { box-shadow: 2px 2px 0 var(--ink); }
  .gstage.full .gp-f { font-size: .78rem; }
  .gstage.full .gm-panel .btn { font-size: .8rem; padding: 2px 10px; border-width: 2px; box-shadow: 2px 2px 0 var(--ink); }
}
@media (orientation: portrait) {
  .gstage.full { align-items: flex-start; overflow-y: auto; }
  .gstage.full .gbox { width: 100vw; }
  .gstage.full .gm-hud, .gstage.full .gm-msg, .gstage.full .gm-panel { position: static; transform: none; margin: 8px; max-width: none; }
  .gstage.full .gm-hud { pointer-events: auto; }
  .gstage.full .gm-panel { display: block; }
  .gstage.full .gp-frow { flex-wrap: wrap; }
  .gstage.full .gm-panel .gp-row, .gstage.full .gm-panel .gp-top { margin: 6px 0; }
}
.gm-hud { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.gpl { flex: 1 1 140px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 3px solid var(--ink); border-radius: 12px; padding: 6px 10px; background: #fff; box-shadow: 3px 3px 0 var(--ink); }
.gpl b { font-family: var(--font-d); font-size: 1.1rem; padding: 0 8px; border-radius: 8px; background: var(--c); border: 2px solid var(--ink); }
.gpl .hr i { font-style: normal; color: #d8d2e8; font-size: 1.05rem; letter-spacing: 1px; }
.gpl .hr i.on { color: #ff4f7b; }
.gpl.turn { background: #fff7c9; transform: translateY(-2px); }
.gpl.out { opacity: .45; filter: grayscale(1); }
.gm-msg { margin: 10px 4px 6px; font-size: 1.02rem; min-height: 1.5em; }
.gm-panel { border: 3px solid var(--ink); border-radius: 12px; padding: 10px 12px; background: #fff; }
.gp-top { margin-bottom: 8px; font-size: 1.05rem; }
.gp-who { display: inline-block; font-family: var(--font-d); border: 2px solid var(--ink); border-radius: 8px; padding: 0 10px; margin-right: 4px; }
.gp-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0; }
.gtile { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-width: 74px; padding: 3px 8px; border: 3px solid var(--ink); border-radius: 14px; background: #fff3b0; box-shadow: 0 3px 0 var(--ink); font-family: inherit; color: var(--ink); line-height: 1.05; }
.gtile .gt-ic { font-size: 28px; }
.gtile .gt-nm { font-size: 12px; font-weight: bold; white-space: nowrap; }
button.gtile { cursor: pointer; animation: gwig 1.2s ease-in-out infinite; background: #ffd23f; }
button.gtile:disabled { animation: none; opacity: .5; cursor: default; }
.gtile.on { background: #fff; animation: gpop .35s ease-out; }
@keyframes gwig { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes gpop { from { transform: scale(.4) rotate(-20deg); } to { transform: none; } }
.gfire[data-nodraw] { opacity: .6; filter: grayscale(.4); }
.gl-wrap { display: inline-flex; align-items: center; gap: 4px; margin-left: 10px; flex-wrap: wrap; }
.gl-lb { font-weight: bold; font-size: .85em; }
.glc { font-family: inherit; font-weight: bold; font-size: .85em; padding: 1px 8px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink); cursor: pointer; }
.glc.on { background: #ffd23f; box-shadow: 0 2px 0 var(--ink); }
.glc:disabled { opacity: .5; cursor: default; }
.gp-start { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 6px 0; flex-wrap: wrap; }
.gstart { font-size: 1.15rem; padding: 6px 22px; background: #ffd23f; }
.gcv .gstart-c { position: absolute !important; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; font-size: clamp(1.1rem, 4.2cqi, 2rem); padding: .35em 1.4em; animation: gwigc 1.2s ease-in-out infinite; }
@keyframes gwigc { 0%,100% { transform: translate(-50%, -50%) rotate(-3deg); } 50% { transform: translate(-50%, -50%) rotate(3deg); } }
.gcv .gstart-c[hidden] { display: none; }
.gp-hint { font-weight: bold; color: #1d1650; }
.stp .sb button { touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.gm-msg[hidden] { display: none !important; }
.gm-panel[hidden] { display: none !important; }
.gcv .gwin-c { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 34px; background: rgba(255,248,210,.92); border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 6px 0 var(--ink); animation: gwinpop .5s ease-out; }
.gcv .gwin-c[hidden] { display: none; }
.gw-t { font-family: var(--font-d); font-size: clamp(1.4rem, 5.5cqi, 2.6rem); white-space: nowrap; display: flex; align-items: center; gap: 12px; }
.gw-b { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.gw-t .gp-who { font-size: .8em; padding: 0 12px; }
@keyframes gwinpop { from { transform: translate(-50%, -50%) scale(.3); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
.hgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 20px; }
.htile { font: inherit; text-align: left; cursor: pointer; background: var(--card); border: 3px solid var(--ink); border-radius: 18px 6px 20px 8px; box-shadow: 6px 6px 0 var(--ink); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; position: relative; border-top: 12px solid var(--c); transition: transform .1s, box-shadow .1s; }
.htile:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--ink); }
.htile:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--ink); }
.htile .hn { position: absolute; top: -26px; left: 14px; width: 34px; height: 34px; border-radius: 50%; background: var(--c); border: 3px solid var(--ink); display: grid; place-items: center; font-family: var(--font-d); font-size: 1.2rem; color: #fff; text-shadow: 1px 1px 0 var(--ink); }
.htile .ht { font-family: var(--font-d); font-weight: 400; font-size: 1.45rem; margin-top: 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.htile .hd { color: var(--muted); font-size: .98rem; }
.htile .hgo { margin-top: 4px; font-family: var(--font-d); color: var(--c); filter: brightness(.7); }
@media (max-width: 640px) { .hgrid { grid-template-columns: 1fr; gap: 26px; } .htile { margin-top: 0; } }
.lobby { display: block; }
.lobby h2 { font-size: 1.7rem; margin-bottom: 6px; }
.lb-sub { color: var(--muted); margin-bottom: 14px; }
.lb-big { display: flex; flex-wrap: wrap; gap: 14px; margin: 14px 0 18px; }
.lb-b { font-size: 1.35rem; padding: 12px 26px; }
.lb-b.alt, .btn.alt { background: #fff; }
.lb-rank { background: #fff8d2; border: 3px solid var(--ink); border-radius: 14px; padding: 10px 16px; max-width: 420px; }
.lb-rank h3 { font-size: 1.15rem; margin-bottom: 4px; }
.lb-rank ol { list-style: none; margin: 0; padding: 0; }
.lb-rank li { display: flex; align-items: center; gap: 8px; padding: 2px 0; font-size: 1.02rem; }
.lb-rank li b { font-family: var(--font-d); font-weight: 400; flex: 1; }
.lb-pick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 6px; }
.lb-pick select, .lb-pin input { font: inherit; font-size: 1.05rem; padding: 6px 10px; border: 3px solid var(--ink); border-radius: 10px; background: #fff; }
.lb-prev { font-family: var(--font-d); font-size: 2rem; margin: 6px 0; min-height: 2.4rem; }
.lb-prev small { font-size: .9rem; color: #c0392b; margin-left: 8px; }
.lb-pin { display: block; margin: 8px 0 4px; font-weight: bold; }
.lb-pin input { width: 8.5em; letter-spacing: .4em; text-align: center; margin-left: 8px; }
.lb-hint { color: var(--muted); font-size: .92rem; }
.lb-err { color: #c0392b; font-weight: bold; min-height: 1.6em; margin-top: 4px; }
.lb-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
.lb-rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin: 12px 0; }
.lb-room { font: inherit; text-align: left; padding: 10px 12px; border: 3px solid var(--ink); border-radius: 14px; background: #fff; box-shadow: 3px 3px 0 var(--ink); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.lb-room b { font-family: var(--font-d); font-weight: 400; font-size: 1.2rem; }
.lb-room em { font-style: normal; font-size: .88rem; color: var(--muted); }
.lb-room.open { background: #e9fbef; }
.lb-room:disabled { opacity: .55; cursor: default; box-shadow: none; background: #eee; }
.lb-slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 12px 0; }
.lb-slot { border: 3px solid var(--ink); border-radius: 14px; padding: 10px 12px; background: #fff; min-height: 76px; display: flex; flex-direction: column; justify-content: center; }
.lb-slot.empty { border-style: dashed; color: var(--muted); background: transparent; }
.lb-slot b { font-family: var(--font-d); font-weight: 400; font-size: 1.15rem; word-break: keep-all; }
.lb-slot .me { background: var(--yellow); border: 2px solid var(--ink); border-radius: 8px; padding: 0 6px; font-size: .8rem; margin-left: 4px; }
.lb-slot.ready { background: #e9fbef; }
.lb-state { margin: 8px 0; padding: 8px 12px; border-radius: 12px; background: #eef2ff; border: 2px solid var(--ink); font-weight: bold; }
.lb-state.go { background: #fff3b0; }

/* ----- 곡선과 비행 계산 ----- */

/* 다음 차례 친구가 정수 a 로 누군가를 맞힐 수 있는 자리인지 확인한다 */

async function lbJoin(i) {

  if (LB.rooms.some(r => r.m.some(x => x.nick === LB.me && !x.me))) { LB.err = '이 닉네임은 다른 기기에서 접속 중이에요.'; lbRender(); return; }
  LB.err = '';
  try {
    const res = await FB.runTransaction(FB.ref('rooms/' + i + '/m'), c => { c = c || {}; if (!c[LB.uid] && Object.keys(c).length >= 3) return; c[LB.uid] = { n: LB.me, r: false, t: Date.now() }; return c; });
    if (!res.committed) { LB.err = '방이 가득 찼어요.'; lbRender(); return; }
    try { FB.onDisconnect(FB.ref('rooms/' + i + '/m/' + LB.uid)).remove(); } catch (e) { }
    LB.room = i; LB.screen = 'wait'; lbRender();
  } catch (e) { LB.err = '입장하지 못했어요. 잠시 뒤에 다시 해 보세요.'; lbRender(); }
}
async function lbLogin() {
  const pin = ($('#lbPin') || {}).value || '', n = lbNick(), er = $('#lbErr'), go = $('#lbGo');
  const bad = t => { LB.err = t; if (er) er.textContent = t; if (go) go.disabled = false; };
  if (!/^\d{4}$/.test(pin)) return bad('비밀번호는 숫자 4자리로 입력해요.');
  if (!FB) return bad('서버에 연결되는 중이에요. 잠시 뒤에 다시 눌러요.');
  if (go) go.disabled = true;
  try {
    const h = await lbSha(n + ':' + pin), ur = FB.ref('users/' + n), s = await FB.get(ur);
    if (s.exists()) { if (s.val().h !== h) return bad('이 닉네임의 비밀번호가 달라요.'); }
    else await FB.set(ur, { h: h, t: Date.now() });
    LB.me = n; LB.err = ''; LB.screen = 'rooms'; lbRender();
  } catch (e) { bad('서버와 통신하지 못했어요. 다시 해 보세요.'); }
}
function lbBegin(R) {
  const st = R.start, i = LB.room;
  try { FB.onDisconnect(FB.ref('rooms/' + i + '/m/' + LB.uid)).cancel(); } catch (e) { }
  gmMode = 'play'; $('#gLobby').hidden = true; $('#gCard').hidden = false;
  gmNew(st.names, st.seed);
  const n = gm.net = { room: i, gid: st.gid, me: st.names.indexOf(LB.me), seq: 0, q: [], busy: 0, off: null };
  n.off = FB.onChildAdded(FB.ref('ev/' + i + '/' + st.gid), snap => { n.q.push({ k: +snap.key, v: snap.val() }); n.q.sort((a, b) => a.k - b.k); });
  gmRender(); gmStartLoop(); gmStart();
}
function lbShowGame() { gmMode = 'play'; $('#gLobby').hidden = true; $('#gCard').hidden = false; }
function lbHome(msg) {
  gmStopLoop(); if ($('#gStage').classList.contains('full')) gmFs(false);
  if (gm.net && gm.net.off) { try { gm.net.off(); } catch (e) { } }
  gm.net = null; lbLeaveRoom(); gmMode = 'lobby'; gm.online = false; gm.phase = 'wait';
  $('#gCard').hidden = true; $('#gLobby').hidden = false; LB.screen = 'home'; LB.err = typeof msg === 'string' ? msg : ''; lbRender();
}
function lbPlay(names) { lbShowGame(); gmNew(names); gmStartLoop(); if (names) gmStart(); }
/* 게임 진행: 모든 입력은 '이벤트'로 서버에 쌓이고, 모든 기기가 같은 순서로 똑같이 실행해요 */
function netSend(o) {
  const n = gm.net; if (!n || !FB || n.busy) return false;
  n.busy = Date.now();
  FB.set(FB.ref('ev/' + n.room + '/' + n.gid + '/' + n.seq), o).catch(() => { n.busy = 0; });
  return true;
}
function netApply(e) {
  if (gm.phase !== 'aim') return false;
  if (e.t === 'draw') { if (!gm.drawn) gmRollItem(e.it); }
  else if (e.t === 'fire') { if (gm.drawn) { gm.v.s = e.s; gm.v.a = e.a; gm.lm = e.lm; gmSync(); gmFireGo(e.sh); } }
  else if (e.t === 'skip') gmSkip();
  return true;
}
function netPump() {
  const n = gm.net; if (!n) return;
  if (n.busy && Date.now() - n.busy > 4000) n.busy = 0;
  while (n.q.length) {
    const e = n.q[0];
    if (e.k < n.seq) { n.q.shift(); continue; }
    if (e.k > n.seq || !netApply(e.v)) break;
    n.q.shift(); n.seq++; n.busy = 0;
  }
}
function netPub() {
  const n = gm.net; if (!n || !FB) return;
  const first = gm.players.findIndex(p => !p.out && p.alive); if (first < 0 || n.me !== first) return;   /* 살아있는 첫 친구만 선생님 화면용 정보를 써요 */
  FB.set(FB.ref('rooms/' + n.room + '/pub'), { ph: gm.phase, turn: gm.players[gm.turn] ? gm.players[gm.turn].k.name : '', msg: gm.msg || '', w: gm.winner >= 0 ? gm.players[gm.winner].k.name : '', pl: gm.players.filter(p => !p.out).map(p => ({ n: p.k.name, l: p.lives, a: p.alive ? 1 : 0 })), t: Date.now() }).catch(() => { });
}
window.__lbWin = g => {
  if (!g.net || !FB) return;
  const w = g.players[g.winner].k.name, l = g.dead.length ? g.players[g.dead[g.dead.length - 1]].k.name : null;
  FB.set(FB.ref('res/' + g.net.room + '/' + g.net.gid), { w: w, l: l, t: Date.now() }).then(() => {   /* 한 번만 쓸 수 있어서, 점수는 딱 한 번만 들어가요 */
    const add = (nm, p, win) => FB.runTransaction(FB.ref('rank/' + nm), c => { c = c || { pts: 0, wins: 0 }; c.pts = (c.pts || 0) + p; if (win) c.wins = (c.wins || 0) + 1; return c; });
    add(w, 3, true); if (l) add(l, 1, false);
  }).catch(() => { });
};
$('#tab-game').addEventListener('click', e => {
  const b = e.target.closest('[data-lb]'); if (!b || b.disabled) return;
  const a = b.dataset.lb;
  if (a === 'enter') { LB.screen = 'nick'; LB.err = ''; lbRender(); }
  else if (a === 'practice') lbPlay();
  else if (a === 'home') lbHome();
  else if (a === 'rand') { LB.pa = lbRnd(NICK_A.length); LB.pn = lbRnd(NICK_N.length); lbRender(); }
  else if (a === 'go') lbLogin();
  else if (a === 'room') lbJoin(+b.dataset.i);
  else if (a === 'ready') { const m = LB.rooms[LB.room].m.filter(x => x.me)[0]; if (m && FB) FB.set(FB.ref('rooms/' + LB.room + '/m/' + LB.uid + '/r'), !m.ready).catch(() => { }); }
  else if (a === 'leave') { lbLeaveRoom(); LB.screen = 'rooms'; LB.err = ''; lbRender(); }
});
$('#tab-game').addEventListener('change', e => {
  if (e.target.id === 'lbA') { LB.pa = +e.target.value; lbPrev(); }
  else if (e.target.id === 'lbN') { LB.pn = +e.target.value; lbPrev(); }
});
$('#tab-game').addEventListener('input', e => { if (e.target.id === 'lbPin') { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); const er = $('#lbErr'); if (er) er.textContent = ''; } });
$('#tab-game').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'lbPin') lbLogin(); });
lbConnect();
function gmEnter() { if (gmMode === 'lobby') { lbRender(); return; } if (!gm.players.length) gmNew(); else gmRender(); gmStartLoop(); }
function gmLeave() { gmStopLoop(); if ($('#gStage').classList.contains('full')) gmFs(false); }

/* ----- 입력 ----- */
function gmSet(id, val) { gm.v[id] = val; const el = $('#gv' + id); if (el) el.textContent = fmt(val); }
function gmStep(id, d) {
  if (gm.phase !== 'aim' || !gmMine()) return false;
  if (id === 'a') { let v = Math.round((gm.v.a + d * 0.2) * 10) / 10; if (v === 0) v = Math.round(d * 0.2 * 10) / 10; gmSet('a', gclamp(v, -9999, 9999)); }   /* a 는 0.2 씩, 위아래 제한 없음 */
  else gmSet(id, gclamp(gm.v[id] + d, 0, id === 'p' ? GX : GY));
  return true;
}
/* ▲▼ 꾹 누르면 계속 변하고, 오래 누를수록 빨라져요 */
let gHold = null;
function gmHoldStop() { if (gHold) { clearTimeout(gHold.t); gHold = null; } }
function gmHoldGo(id, d, n) {
  if (!gmStep(id, d)) { gmHoldStop(); return; }
  const wait = n === 0 ? 420 : n < 4 ? 170 : n < 10 ? 100 : n < 20 ? 60 : 35;
  gHold.t = setTimeout(() => { if (gHold) gmHoldGo(id, d, n + 1); }, wait);
}
$('#tab-game').addEventListener('pointerdown', () => { gm.idle = 0; }, true);
$('#tab-game').addEventListener('keydown', () => { gm.idle = 0; }, true);
$('#tab-game').addEventListener('pointerdown', e => {
  const b = e.target.closest('button[data-gst]'); if (!b || e.button > 0) return;
  e.preventDefault(); gmHoldStop(); gHold = { t: 0 };
  gmHoldGo(b.dataset.gst, +b.dataset.d, 0);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, gmHoldStop, true));
window.addEventListener('blur', gmHoldStop);
$('#tab-game').addEventListener('contextmenu', e => { if (e.target.closest('button[data-gst]')) e.preventDefault(); });
$('#tab-game').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.gst) {
    if (e.detail !== 0) return;   /* 마우스·터치는 pointerdown 에서 처리 (키보드 클릭만 여기서) */
    gmStep(b.dataset.gst, +b.dataset.d);
  } else if (b.dataset.gsg) { if (gm.phase === 'aim' && gmMine()) { gm.v.s = -gm.v.s; b.textContent = gm.v.s > 0 ? '+' : M; } }
  else if (b.dataset.glen) { if (gm.phase === 'aim' && gmMine()) { gm.lm = parseFloat(b.dataset.glen); gmPanel(); gmDraw(); } }
  else if (b.dataset.gstart) gmStart();
  else if (b.dataset.draw) { if (gm.net) { if (gmMine() && gm.phase === 'aim' && !gm.drawn) netSend({ t: 'draw', it: gmPickId() }); } else gmRollItem(); }
  else if (b.dataset.fire) gmFire();
  else if (b.dataset.gnew) gmNew();
});

/* ----- 전체화면 ----- */
function gmFsLabel() { const st = $('#gStage'); $('#gFs').textContent = st.classList.contains('full') ? '✕ 닫기' : '⛶ 전체화면'; document.body.style.overflow = st.classList.contains('pfs') ? 'hidden' : ''; }
function gmFs(on) {
  const st = $('#gStage');
  if (on === undefined) on = !st.classList.contains('full');
  if (on) {
    st.classList.add('full');
    const rq = st.requestFullscreen || st.webkitRequestFullscreen;
    if (rq) { try { Promise.resolve(rq.call(st)).catch(() => { st.classList.add('pfs'); gmFsLabel(); }); } catch (err) { st.classList.add('pfs'); } }
    else st.classList.add('pfs');
  } else {
    st.classList.remove('full', 'pfs');
    if (document.fullscreenElement || document.webkitFullscreenElement) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (err) { } }
  }
  gmFsLabel();
}
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => {
  const st = $('#gStage'); if (!document.fullscreenElement && !document.webkitFullscreenElement && !st.classList.contains('pfs')) st.classList.remove('full');
  gmFsLabel();
}));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#gStage').classList.contains('pfs')) gmFs(false); });
$('#gFs').addEventListener('click', () => gmFs());
/*GM-EXPOSE*/

/* ---------- 탭 ---------- */
function homeRender() {
  const T = [
    ['sym', '1', F.base + ' 대칭이동', 'x축·y축·원점에 대칭이동하면 그래프가 어떻게 바뀔까요?', '#ff8a3d'],
    ['a', '2', F.gen + ' a의 크기 비교', 'a가 커지고 작아질 때 곡선이 어떻게 변하는지 비교해요.', '#14b8a6'],
    ['shift', '3', '평행이동', fx(['y', '=', sq('ax+b'), '+', 'c']) + ' 를 x축·y축 방향으로 옮겨서 그려요.', '#4f7cff'],
    ['game', '4', '🍠 무리구마 대결', '식을 만들어 고구마를 날려 친구를 맞혀요!', '#ff5d8f']
  ];
  $('#hGrid').innerHTML = T.map(t => '<button type="button" class="htile" data-go="' + t[0] + '" style="--c:' + t[4] + '"><span class="hn">' + t[1] + '</span><b class="ht">' + t[2] + '</b><span class="hd">' + t[3] + '</span><span class="hgo">열기 →</span></button>').join('');
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go]'); if (!t) return;
  showTab(t.dataset.go); try { location.hash = '#' + t.dataset.go; } catch (er) {} window.scrollTo(0, 0);
});
const TABS = ['home', 'sym', 'a', 'shift', 'game'];
let cur = 'home';
function showTab(n) {
  if (TABS.indexOf(n) < 0) n = 'home';
  const prev = cur; cur = n;
  TABS.forEach(t => { $('#tab-' + t).hidden = t !== n; });
  if (prev === 'game' && n !== 'game') gmLeave();
  $$('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === n ? 'true' : 'false'));
  if (n === 'game') gmEnter();
  if (n === 'home') homeRender();
  redraw();
}
function redraw() {
  if (cur === 'sym') drawSym(); else if (cur === 'a') updateA(); else if (cur === 'shift') updateShift(); else if (cur === 'game' && gmMode === 'play') gmDraw();
}
$$('.tabs button').forEach(b => b.addEventListener('click', () => {
  showTab(b.dataset.tab);
  try { location.hash = '#' + b.dataset.tab; } catch (e) {}
}));
window.addEventListener('hashchange', () => { try { showTab(location.hash.slice(1)); } catch (e) {} });
window.addEventListener('resize', redraw);

/* ---------- 시작 ---------- */
$('#sub').innerHTML = '공통수학2 · ' + F.base + ' 의 대칭이동, a의 크기, 평행이동, 대결 게임';
$('#baseF').innerHTML = F.base;
$('#genF').innerHTML = fx(['y', '=', fx(['±', sq('ax')], true)]);
$('#ghostF').innerHTML = F.base;
$('#tabHome').innerHTML = '<span>🏠</span><span>홈</span>';
$('#tabSym').innerHTML = '<span>1.</span>' + F.base + '<span>대칭이동</span>';
$('#tabA').innerHTML = '<span>2.</span>' + F.gen + '<span>a의 크기 비교</span>';
$('#tabShift').innerHTML = '<span>3.</span><span>평행이동</span>';
$('#tabGame').innerHTML = '<span>4.</span><span>무리구마 대결</span>';
renderSymPanel();
let start = 'home'; try { start = location.hash.slice(1) || 'home'; } catch (e) {}
showTab(start);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
})();
</script>
